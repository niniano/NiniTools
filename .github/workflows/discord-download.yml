# 디스코드 고정 「다운로드」 임베드를 최신 버전 · 받은 횟수로 고침
# - 4시간마다 (UTC 0·4·8·12·16·20시 = 한국 9·13·17·21·1·5시 · GitHub 사정으로 몇십 분 늦을 수 있음)
# - NiniTools 릴리스 Publish → release-zip.yml 이 ZIP 을 붙인 뒤 바로 한 번 (ZIP 이 붙기 전에 돌면 이전 버전이 보이므로 release 이벤트로는 안 돌림)
# - Actions 탭 「Run workflow」 로 직접 실행
# 필요한 설정 (Settings → Secrets and variables → Actions):
#   Secret   DISCORD_DOWNLOAD_WEBHOOK : 고정 메시지를 올린 그 웹훅 주소
#   Variable DOWNLOAD_MESSAGE_ID      : 고정 메시지 번호 (pinned_message_id.txt 안 숫자 또는 메시지 링크)
#                                       여러 개면 쉼표로 구분 (예: 111,222) · 모두 위 웹훅이 올린 메시지여야 함
name: Discord download embed

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      new_message:
        description: "새 메시지로 올리기 (고칠 메시지를 못 찾을 때 · 올린 뒤 번호를 DOWNLOAD_MESSAGE_ID 에 넣고 고정)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-download
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/discord
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update pinned embed
        env:
          DISCORD_DOWNLOAD_WEBHOOK: ${{ secrets.DISCORD_DOWNLOAD_WEBHOOK }}
          DOWNLOAD_MESSAGE_ID: ${{ vars.DOWNLOAD_MESSAGE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          NEW_MESSAGE: ${{ inputs.new_message }}
        run: python .github/discord/update_download_embed.py
